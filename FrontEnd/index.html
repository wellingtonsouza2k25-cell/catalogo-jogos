<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Jogos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="dashboard-container">
        <!-- Formulário de Cadastro -->
        <section class="container-formulario">
            <h2>Cadastrar Jogo</h2>
            
            <div class="grupo-input">
                <label for="titulo">Título do Jogo</label>
                <input type="text" id="titulo" name="titulo"  placeholder="Ex: Minecraft" required>
            </div>

            <div class="grupo-input">
                <label for="plataforma">Plataforma</label>
                <input type="text" id="plataforma" name="plataforma" placeholder="Ex: PC, PS5" required>
            </div>

            <div class="grupo-input">
                <label for="genero">Gênero</label>
                <input type="text" id="genero" name="genero" placeholder="Ex: Sandbox, RPG" required>
            </div>

            <div class="grupo-input">
                <label for="ano">Ano de Lançamento</label>
                <input type="number" id="ano" name="ano" placeholder="Ex: 2011" required>
            </div>

            <div class="acoes-formulario">
                <button type="button" id="btn-salvar" class="btn-salvar">Salvar Jogo</button>
                <button type="button" id="btn-cancelar" class="btn-cancelar">Cancelar</button>
            </div>

            <div id="mensagemErro" class="mensagemErro">
                <p>Erro ao Cadastrar jogo, dados obrigatorios ausentes.</p>
            </div>

            <div id="messagemCadastrado" class="messagemCadastrado">
                <p>Jogo cadastrado com sucesso!</p>
            </div>
        </section>

        <!-- Tabela do Catálogo -->
        <section class="container-catalogo">
            <h2>Catálogo de Jogos</h2>

            
            <table class="tabela-jogos">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Plataforma</th>
                        <th>Gênero</th>
                        <th>Ano</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </section>
    </main>

    <!-- MODAL DE EDIÇÃO -->
    <div id="modal-editar" class="modal-overlay">
        <div class="modal-card">
            <h2>Editar Jogo</h2>
            <input type="hidden" id="edit-id">

            <div class="grupo-input">
                <label for="edit-titulo">Título do Jogo</label>
                <input type="text" id="edit-titulo" required>
            </div>

            <div class="grupo-input">
                <label for="edit-plataforma">Plataforma</label>
                <input type="text" id="edit-plataforma" required>
            </div>

            <div class="grupo-input">
                <label for="edit-genero">Gênero</label>
                <input type="text" id="edit-genero" required>
            </div>

            <div class="grupo-input">
                <label for="edit-ano">Ano de Lançamento</label>
                <input type="number" id="edit-ano" required>
            </div>

            <div class="modal-acoes">
                <button type="button" id="btn-fechar-editar" class="btn-modal-cancelar">Cancelar</button>
                <button type="button" id="btn-confirmar-editar" class="btn-modal-salvar">Salvar Alterações</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE EXCLUSÃO -->
    <div id="modal-excluir" class="modal-overlay">
        <div class="modal-card modal-pequeno">
            <h2>Excluir Jogo</h2>
            <p class="modal-texto">Tem certeza que deseja excluir <strong id="excluir-nome-jogo"></strong>? Esta ação não poderá ser desfeita.</p>
            
            <div class="modal-acoes">
                <button type="button" id="btn-fechar-excluir" class="btn-modal-cancelar">Cancelar</button>
                <button type="button" id="btn-confirmar-excluir" class="btn-modal-excluir">Excluir</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
